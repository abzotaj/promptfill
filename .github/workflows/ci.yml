name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Package extension
        run: cd apps/extension/dist && zip -qr ../../../promptfill-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: promptfill-extension
          path: promptfill-extension.zip
