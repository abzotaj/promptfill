<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PromptFill options</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: light dark; --accent: #8b6dff; }
      body { font: 14px/1.5 system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p.sub { margin: 0 0 24px; opacity: .7; }
      label { display: block; font-weight: 600; margin: 16px 0 6px; }
      small { display: block; opacity: .65; font-weight: 400; margin-top: 4px; }
      input[type=text], input[type=url], select {
        width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px;
        border: 1px solid #8884; font: inherit; background: transparent; color: inherit;
      }
      .check { display: flex; gap: 8px; align-items: center; font-weight: 400; }
      button { margin-top: 24px; padding: 9px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      #status { margin-left: 12px; }
      .row { display: flex; align-items: center; }
      code { font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>PromptFill</h1>
    <p class="sub">Click the toolbar icon (or press <code>Alt+Shift+F</code>) on any page to fill its form from a prompt.</p>

    <form id="form">
      <label for="endpoint">Server URL
        <small>Your PromptFill server. Run it locally with <code>npm run dev:server</code>.</small>
      </label>
      <input id="endpoint" type="url" required placeholder="http://localhost:8787" />

      <label for="publishableKey">Publishable key
        <small>Must be allowed for <code>chrome-extension://</code> origins in the server's PROMPTFILL_SITES.</small>
      </label>
      <input id="publishableKey" type="text" required placeholder="pk_ext" />

      <label for="locale">Locale for generated data
        <small>Optional, e.g. <code>sq-AL</code>, <code>de-CH</code>. Empty uses the browser's language.</small>
      </label>
      <input id="locale" type="text" placeholder="sq-AL" />

      <label for="theme">Theme</label>
      <select id="theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>

      <label class="check"><input id="confirm" type="checkbox" /> Preview values before filling</label>

      <div class="row"><button type="submit">Save</button><span id="status" role="status"></span></div>
    </form>
    <script src="options.js"></script>
  </body>
</html>
